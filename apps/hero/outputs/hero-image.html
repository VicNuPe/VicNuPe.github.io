<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hero Section</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preload" as="image" href="assets/img/hero-image.jpg">

  <style type="text/tailwindcss">

    .hero {
      @apply relative flex items-center w-full px-6 py-16 md:px-12 md:py-24 overflow-hidden;
    }

    .hero-overlay {
      @apply absolute inset-0 w-full h-full z-10 pointer-events-none;
    }

    .hero-content {
      @apply relative z-20 w-full max-w-5xl mx-auto;
    }

    .hero-centre {
      @apply text-center;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    .hero h1 {
      @apply text-4xl md:text-6xl font-bold leading-tight text-shadow-lg/30;
      overflow-wrap: anywhere;
    }

    .hero h2 {
      @apply mt-6 text-lg md:text-2xl leading-relaxed text-shadow-lg/30;
      overflow-wrap: anywhere;
    }

    .heading-sans {
      @apply font-sans;
    }

    .heading-serif {
      @apply font-serif;
    }
  
  </style>

  <style>
    .hero {
      background-image: url('assets/img/hero-image.jpg');
      background-size: cover;
      background-position: center;
    }
    .hero-overlay {
      opacity: 0.7;
      background-image: linear-gradient(to right, var(--color-cyan-200, #a5f3fc), var(--color-indigo-950, #1e1b4b));
      background-color: transparent;
    }
    .hero h1 {
      color: var(--color-white, #ffffff);
    }
    .hero h2 {
      color: var(--color-white, #ffffff);
    }

    .hero h1 {
      letter-spacing: 0.035em;
    }

    .hero h2 {
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <header class="hero hero-centre">
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-content">
      <h1 class="heading-serif">Lorem ipsum dolor sit amet</h1>
      <h2 class="heading-serif">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </header>

</body>
</html>
