<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hero Section</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">

    .hero {
      @apply flex items-center w-full px-6 py-16 md:px-12 md:py-24;
    }

    .hero-content {
      @apply w-full max-w-5xl mx-auto;
    }

    .hero-light {
      @apply bg-slate-50 text-slate-900;
    }

    .hero-dark {
      @apply bg-slate-900 text-slate-50;
    }

    .hero-centre {
      @apply text-center;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    .hero h1 {
      @apply text-4xl md:text-6xl font-bold leading-tight;
      overflow-wrap: anywhere;
    }

    .hero h2 {
      @apply mt-6 text-lg md:text-2xl leading-relaxed;
      overflow-wrap: anywhere;
    }

    .heading-sans {
      @apply font-sans;
    }

    .heading-serif {
      @apply font-serif;
    }

    .hero-light h1 {
      @apply text-slate-900;
    }

    .hero-light h2 {
      @apply text-slate-700;
    }

    .hero-dark h1 {
      @apply text-slate-50;
    }

    .hero-dark h2 {
      @apply text-slate-300;
    }
  
  </style>

  <style>
    .hero {
      background-image: linear-gradient(to right, var(--color-cyan-300, #67e8f9), var(--color-blue-950, #172554));
      background-color: transparent;
    }
    .hero h1 {
      color: var(--color-slate-50, #f8fafc);
    }
    .hero h2 {
      color: var(--color-slate-700, #334155);
    }

    .hero h1 {
      letter-spacing: -0.05em;
    }

    .hero h2 {
      letter-spacing: -0.025em;
    }
  </style>
</head>
<body>

  <header class="hero hero-light hero-min-height">
    <div class="hero-content">
      <h1 class="heading-sans">Lorem ipsum dolor sit amet</h1>
      <h2 class="heading-sans">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </header>

</body>
</html>
